<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liazon | Contact</title>
    <meta name="description" content="Contact Liazon for inquiries." />
    <link rel="canonical" href="https://www.liazon.ai/contact.html" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.liazon.ai/#organization",
            "name": "Liazon",
            "url": "https://www.liazon.ai/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.liazon.ai/assets/images/liazonicon.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.liazon.ai/#website",
            "name": "Liazon",
            "url": "https://www.liazon.ai/",
            "publisher": { "@id": "https://www.liazon.ai/#organization" }
          }
        ]
      }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css"/>
    <link rel="icon" type="image/png" href="assets/images/liazonicon.png">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src = "assets/images/liazonicon.png" alt = "Liazon icon" style = "max-width:50px;height:auto;">
        <p>Liazon</p>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <button
          class="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="site-nav-panel"
        >
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="nav-backdrop" aria-hidden="true"></div>
        <div class="nav-panel" id="site-nav-panel">
          <a href="index.html">Home</a>
          <a href="features.html">Features</a>
          <a href="use-cases/index.html">Use Cases</a>
          <a href="pricing.html">Pricing</a>
          <a href="liazon-vs-calendly-vs-doodle/index.html">Compare</a>
          <a href="about.html">About</a>
          <a href="contact.html" aria-current="page">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <h1>Contact us</h1>
        <p>Sign up for Preview or send us a note</p>
      </section>

      <section class="content">
        <form class="contact-form" id="contact-form">
          <label>
            Name
            <input type="text" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Company
            <input type="text" name="company" autocomplete="organization" />
          </label>
          <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
            <label>
              Website
              <input type="text" name="website" tabindex="-1" autocomplete="off" />
            </label>
          </div>

          <label>
            Message
            <textarea name="message" rows="4" required></textarea>
          </label>
          <button class="button" type="submit">Send message</button>
          <p class="form-note" id="form-note" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Liazon, LLC. All rights reserved.</span>
    </footer>

    <script src="assets/js/site.js"></script>
  </body>
</html>
