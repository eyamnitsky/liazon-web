<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="//script.crazyegg.com/pages/scripts/0132/1385.js" async="async"></script>
    <title>Liazon | Contact</title>
    <meta name="description" content="Contact Liazon for inquiries." />
    <link rel="canonical" href="https://www.liazon.ai/contact/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.liazon.ai/#organization",
            "name": "Liazon",
            "url": "https://www.liazon.ai/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.liazon.ai/assets/images/liazonicon.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.liazon.ai/#website",
            "name": "Liazon",
            "url": "https://www.liazon.ai/",
            "publisher": { "@id": "https://www.liazon.ai/#organization" }
          }
        ]
      }
    </script>
    <link rel="stylesheet" href="/assets/css/styles.css"/>
    <link rel="icon" type="image/png" href="/assets/images/liazonicon.png">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Liazon home">
        <img src="/assets/images/liazonicon.png" alt = "Liazon icon" style = "max-width:50px;height:auto;">
        <p>Liazon</p>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <button
          class="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="site-nav-panel"
        >
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="nav-backdrop" aria-hidden="true"></div>
        <div class="nav-panel" id="site-nav-panel">
          <a href="/">Home</a>
          <a href="/features/">Features</a>
          <a href="/use-cases/">Use Cases</a>
          <a href="/pricing/">Pricing</a>
          <a href="/liazon-vs-calendly-vs-doodle/">Compare</a>
          <a class="nav-cta" href="/signup.html">Sign-up for free</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <h1>Contact us</h1>
        <p>Send us a note</p>
      </section>

      <section class="content">
        <form class="contact-form" id="contact-form">
          <label>
            Name
            <input type="text" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Company
            <input type="text" name="company" autocomplete="organization" />
          </label>
          <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
            <label>
              Website
              <input type="text" name="website" tabindex="-1" autocomplete="off" />
            </label>
          </div>

          <label>
            Message
            <textarea name="message" rows="4" required></textarea>
          </label>
          <div class="turnstile-wrap">
            <div class="turnstile-widget" data-sitekey="__TURNSTILE_SITE_KEY__"></div>
          </div>
          <button class="button" type="submit">Send message</button>
          <p class="form-note" id="form-note" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Liazon, LLC. All rights reserved.</span>
      <span class="footer-links">
        <a href="/about/">About</a>
        ·
        <a href="/contact/">Contact</a>
      </span>
    </footer>

    <script src="/assets/js/site.js?v=2026-02-13"></script>
  </body>
</html>
