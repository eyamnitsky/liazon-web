      <stop offset="0" stop-color="#0f5cd7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0f5cd7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="192" height="144" rx="18" fill="url(#g1)"/>

  <!-- Envelope -->
  <rect x="16" y="40" width="96" height="64" rx="10" fill="#ffffff" stroke="#143a6a" stroke-width="6"/>
  <path d="M24 48 L64 80 L104 48" fill="none" stroke="#143a6a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 96 L56 76" fill="none" stroke="#d8e1ec" stroke-width="6" stroke-linecap="round"/>
  <path d="M104 96 L72 76" fill="none" stroke="#d8e1ec" stroke-width="6" stroke-linecap="round"/>

