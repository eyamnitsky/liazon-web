  <text x="94" y="116" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Iris</text>
  <path d="M140 108 l6 -6 l6 6 l-6 6z" fill="#ffffff" opacity="0.95"/>
