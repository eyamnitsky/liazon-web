name: Emergency CloudWatch Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-cloudwatch-audit.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::345594578426:role/GitHubDeployRoleIrisProd
          aws-region: us-east-1

      - name: Audit recent CloudWatch activity
        shell: bash
        run: |
          set -euo pipefail
          REGION="us-east-1"
          NOW_MS=$(($(date -u +%s) * 1000))
          START_2H_MS=$((NOW_MS - 2 * 60 * 60 * 1000))
          START_24H_MS=$((NOW_MS - 24 * 60 * 60 * 1000))
          MATCH_REGEX='(liazon|iris|signup|sign-up|contact|email|ses|brevo|schedule)'
          FILTER_PATTERN='?signup ?Sign-up ?company_name ?Iris ?iris ?email ?Email ?ses ?SES ?brevo ?Brevo ?calendar ?schedule ?Schedule'

          echo "Audit window 2h start ms: ${START_2H_MS}"
          echo "Context window 24h start ms: ${START_24H_MS}"
          echo

          all_groups=$(aws logs describe-log-groups \
            --region "$REGION" \
            --query 'logGroups[].logGroupName' \
            --output text | tr '\t' '\n' || true)

          mapfile -t GROUPS < <(printf '%s\n' "$all_groups" | awk 'NF' | grep -Ei "$MATCH_REGEX" | sort -u || true)

          if [ "${#GROUPS[@]}" -eq 0 ]; then
            echo "No CloudWatch log groups matched ${MATCH_REGEX}."
            exit 0
          fi

          echo "Matched log groups (${#GROUPS[@]}):"
          printf '  %s\n' "${GROUPS[@]}"
          echo

          echo "Recent stream activity summary:"
          ACTIVE_GROUPS=()
          for group in "${GROUPS[@]}"; do
            latest=$(aws logs describe-log-streams \
              --region "$REGION" \
              --log-group-name "$group" \
              --order-by LastEventTime \
              --descending \
              --max-items 1 \
              --query 'logStreams[0].lastEventTimestamp' \
              --output text 2>/dev/null || true)

            if [ -z "$latest" ] || [ "$latest" = "None" ]; then
              printf '  idle/no-events %s\n' "$group"
              continue
            fi

            iso=$(date -u -d "@$((latest / 1000))" +%Y-%m-%dT%H:%M:%SZ)
            if [ "$latest" -ge "$START_2H_MS" ]; then
              ACTIVE_GROUPS+=("$group")
              printf '  ACTIVE_2H latest=%s group=%s\n' "$iso" "$group"
            elif [ "$latest" -ge "$START_24H_MS" ]; then
              printf '  active_24h latest=%s group=%s\n' "$iso" "$group"
            else
              printf '  older latest=%s group=%s\n' "$iso" "$group"
            fi
          done
          echo

          if [ "${#ACTIVE_GROUPS[@]}" -eq 0 ]; then
            echo "No matched log groups had events in the last 2 hours."
            exit 0
          fi

          echo "Pattern-hit counts for active groups over last 2h:"
          for group in "${ACTIVE_GROUPS[@]}"; do
            tmp=$(mktemp)
            aws logs filter-log-events \
              --region "$REGION" \
              --log-group-name "$group" \
              --start-time "$START_2H_MS" \
              --filter-pattern "$FILTER_PATTERN" \
              --query 'events[].message' \
              --output text > "$tmp" || true

            hits=$(awk 'END { print NR }' "$tmp")
            printf '  hits=%s group=%s\n' "$hits" "$group"
            if [ "$hits" -gt 0 ]; then
              echo "    Redacted samples:"
              sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g; s/[0-9]{3}[-. )]*[0-9]{3}[-. ]*[0-9]{4}/[redacted-phone]/g' "$tmp" | head -5 | sed 's/^/      /' || true
            fi
            rm -f "$tmp"
          done
