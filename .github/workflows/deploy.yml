name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::345594578426:role/GitHubDeployRoleIrisProd
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://www.liazon.ai \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Update and publish CloudFront function
        run: |
          set -euo pipefail
          FUNCTION_NAME="liazon-canonical-redirects"
          FUNCTION_FILE="cloudfront-functions/liazon-canonical-redirects.js"
          FUNCTION_COMMENT="Canonical redirects + trailing-slash index rewrite"

          DEV_ETAG=$(aws cloudfront describe-function \
            --name "$FUNCTION_NAME" \
            --stage DEVELOPMENT \
            --query "ETag" \
            --output text)

          UPDATE_ETAG=$(aws cloudfront update-function \
            --name "$FUNCTION_NAME" \
            --if-match "$DEV_ETAG" \
            --function-config "Comment=$FUNCTION_COMMENT,Runtime=cloudfront-js-2.0" \
            --function-code "fileb://$FUNCTION_FILE" \
            --query "ETag" \
            --output text)

          aws cloudfront publish-function \
            --name "$FUNCTION_NAME" \
            --if-match "$UPDATE_ETAG"

          for i in {1..24}; do
            STATUS=$(aws cloudfront describe-function \
              --name "$FUNCTION_NAME" \
              --stage LIVE \
              --query "FunctionSummary.Status" \
              --output text)
            if [ "$STATUS" = "DEPLOYED" ]; then
              break
            fi
            sleep 5
          done

          if [ "$STATUS" != "DEPLOYED" ]; then
            echo "CloudFront function did not reach DEPLOYED status in time."
            exit 1
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "EJENZS2ECEK" \
            --paths "/*"
